# Local development database (PostgreSQL 16 + PostGIS).
# Start:  docker compose -f deploy/docker-compose.dev.yml up -d
# Stop:   docker compose -f deploy/docker-compose.dev.yml down        (data is kept)
# Reset:  docker compose -f deploy/docker-compose.dev.yml down -v     (deletes all data)
services:
  db:
    image: postgis/postgis:16-3.5
    container_name: opencrm-db
    environment:
      POSTGRES_DB: opencrm
      POSTGRES_USER: opencrm
      POSTGRES_PASSWORD: opencrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencrm -d opencrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
