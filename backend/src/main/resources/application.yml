spring:
  application:
    name: open-crm
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opencrm}
    username: ${DB_USER:opencrm}
    password: ${DB_PASSWORD:opencrm}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # correct https URLs behind a reverse proxy

app:
  # Used for "due today", "this month" etc.
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  jwt:
    # MUST be overridden in production (at least 32 characters)
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    # Comma-separated origin patterns allowed to call the API
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,https://localhost,http://localhost,capacitor://localhost,app://*}
  bootstrap-admin:
    # Created only when the users table is empty
    email: ${ADMIN_EMAIL:admin@opencrm.local}
    password: ${ADMIN_PASSWORD:admin123}
    full-name: ${ADMIN_NAME:Administrator}
  ai:
    # Agent assistant on support tickets (summary + suggested reply).
    #   ollama    = open-source local model (default; install Ollama and `ollama pull qwen2.5:3b`)
    #   anthropic = Claude API (paid cloud service, needs ANTHROPIC_API_KEY)
    #   none      = switched off
    provider: ${AI_PROVIDER:ollama}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-5-5}

---
spring:
  config:
    activate:
      on-profile: prod
app:
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  bootstrap-admin:
    password: ${ADMIN_PASSWORD}
